# Référentiel unique des actifs suivis.
# Ajouter un actif = ajouter un bloc [[actifs]] ici, rien d'autre.
#
# Champs :
#   id         code court, unique, utilisé dans les scripts et le site
#   ticker     symbole au format EODHD (TICKER.PLACE)
#   table      ancienne table BigQuery par actif (sert uniquement à la migration)
#   nom        libellé affiché
#   devise     devise de cotation ; "USD" => converti en EUR via la parité EUR/USD
#   categories regroupements d'affichage
#   frequence  "daily" (mardi-samedi) ou "weekly" (dimanche) : le plan gratuit
#              EODHD limite à 20 appels API par jour
#   affiche    false = importé mais pas encore présenté sur le site

[projet]
bq_project = "etf-monitoring"
bq_dataset = "etf_data"
# Modèle BigQuery : une table de cours pour tous les actifs, le référentiel
# des actifs (copie de ce fichier) et une vue des cours convertis en euros.
table_cours = "cours"
table_actifs = "actifs"
vue_cours_eur = "cours_eur"
date_debut_defaut = "2000-01-01"
# Plan gratuit EODHD : 20 appels par jour, 1 appel par actif. Chaque fréquence
# (daily, weekly) doit rester sous ce plafond : le chargement échoue sinon.
quota_appels_jour = 20

# Libellés des catégories, dans l'ordre d'affichage sur le site.
[categories]
harry_browne = "Portefeuille Harry Browne"
world = "Monde"
us = "États-Unis"
europe = "Europe"
asie = "Asie"
secteurs = "Secteurs et thématiques"
obligations = "Obligations"
hard_assets = "Actifs réels"
devises = "Devises"

# Parité utilisée pour convertir les actifs cotés en USD.
[parite]
id = "EURUSD"
ticker = "EURUSD.FOREX"
table = "eur_usd_parity"
nom = "Parité EUR/USD"
categories = ["devises"]
frequence = "daily"

